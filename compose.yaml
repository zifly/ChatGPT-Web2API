services:
  chatgpt-web2api:
    image: chatgpt-web2api-base:local
    build:
      context: .
      args:
        HTTP_PROXY: ${W2A_BUILD_PROXY_URL:-}
        HTTPS_PROXY: ${W2A_BUILD_PROXY_URL:-}
        NO_PROXY: ${W2A_BUILD_NO_PROXY:-localhost,127.0.0.1,::1}
        DEBIAN_MIRROR: ${W2A_DEBIAN_MIRROR:-https://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${W2A_DEBIAN_SECURITY_MIRROR:-https://security.debian.org/debian-security}
        PIP_INDEX_URL: ${W2A_PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: chatgpt-web2api
    env_file:
      - ./data/api.env
    ports:
      - "${W2A_BIND_ADDRESS-127.0.0.1}:11111:8080"
    volumes:
      # Private login state; never include these directories in Git or images.
      - ./data/chrome-profile:/data/chrome-profile
      - ./data/cookies:/data/cookies:ro
      - ./data/usage:/data/usage
    environment:
      - W2A_HEADLESS=true
      - W2A_PORT=8080
      - W2A_HOST=0.0.0.0
      - W2A_TAB_MODE=owned
      - W2A_PARALLEL_TABS=true
      - W2A_REST_POOL_SIZE=${W2A_REST_POOL_SIZE:-2}
      - W2A_REST_POOL_MAX_QUEUE=${W2A_REST_POOL_MAX_QUEUE:-32}
      - W2A_USAGE_DB_PATH=/data/usage/usage.sqlite3
      - W2A_USAGE_RETENTION_DAYS=${W2A_USAGE_RETENTION_DAYS:-90}
      - W2A_REPLY_SOURCE=${W2A_REPLY_SOURCE:-reconciled}

      # ---------------- 代理设置 ----------------
      # Optional runtime proxy, configured only in the private .env file.
      - HTTP_PROXY=${W2A_PROXY_URL:-}
      - HTTPS_PROXY=${W2A_PROXY_URL:-}
      - http_proxy=${W2A_PROXY_URL:-}
      - https_proxy=${W2A_PROXY_URL:-}
      - W2A_CHROME_PROXY=${W2A_PROXY_URL:-}
      - NO_PROXY=localhost,127.0.0.1,::1
      - no_proxy=localhost,127.0.0.1,::1

      # （如果代理在旁路由/路由器上，将 host.docker.internal 改为路由器的 IP）
      # ------------------------------------------

    # 让 Docker 容器识别 NAS 本机 IP
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
