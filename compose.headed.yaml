services:
  chatgpt-web2api:
    image: chatgpt-web2api-headed:local
    build:
      context: .
      dockerfile: Dockerfile.headed
    ports:
      - "${W2A_BIND_ADDRESS-127.0.0.1}:6080:6080"
    environment:
      - W2A_REPLY_SOURCE=${W2A_REPLY_SOURCE:-reconciled}
      - W2A_HEADLESS=false
      - W2A_LOGIN_TIMEOUT_SECONDS=${W2A_LOGIN_TIMEOUT_SECONDS:-0}
      - DISPLAY=:99
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/vnc-password.txt:/run/secrets/vnc-password:ro
    stop_grace_period: 30s
